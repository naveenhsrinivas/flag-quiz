<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11151f" media="(prefers-color-scheme: dark)">
  <title>Flag & Capital Quiz</title>
</head>
<body>
  <main class="app">
    <!-- Start screen -->
    <section id="start-screen" class="screen">
      <h1>🌍 Flag &amp; Capital Quiz</h1>
      <p class="subtitle">Practise countries, capitals and flags.</p>

      <div class="field">
        <span class="label">Mode</span>
        <div class="chips" id="mode-chips">
          <button class="chip active" data-value="flag-country">Flag → Country</button>
          <button class="chip" data-value="country-capital">Country → Capital</button>
          <button class="chip" data-value="capital-country">Capital → Country</button>
          <button class="chip" data-value="map">🗺️ Find on Map</button>
          <button class="chip" data-value="mixed">Mixed</button>
        </div>
      </div>

      <div class="field">
        <span class="label">Region</span>
        <div class="chips" id="region-chips">
          <button class="chip active" data-value="All">All</button>
          <button class="chip" data-value="Africa">Africa</button>
          <button class="chip" data-value="Asia">Asia</button>
          <button class="chip" data-value="Europe">Europe</button>
          <button class="chip" data-value="North America">North America</button>
          <button class="chip" data-value="South America">South America</button>
          <button class="chip" data-value="Oceania">Oceania</button>
        </div>
      </div>

      <div class="field">
        <span class="label">Questions</span>
        <div class="chips" id="count-chips">
          <button class="chip active" data-value="10">10</button>
          <button class="chip" data-value="20">20</button>
          <button class="chip" data-value="50">50</button>
          <button class="chip" data-value="all">All</button>
        </div>
      </div>

      <button id="start-btn" class="primary">Start quiz</button>
      <p id="start-error" class="error hidden" role="alert"></p>
      <p id="best-score" class="muted"></p>
    </section>

    <!-- Quiz screen -->
    <section id="quiz-screen" class="screen hidden">
      <header class="quiz-header">
        <div class="stats">
          <span id="progress">1 / 10</span>
          <span>Score <strong id="score">0</strong></span>
          <span>🔥 <strong id="streak">0</strong></span>
          <span>⏱ <strong id="timer">0:00</strong></span>
          <button id="quit-btn" class="icon-btn" aria-label="Quit" title="Quit">✕</button>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
      </header>

      <div id="quiz-body" class="quiz-body">
        <div class="quiz-ask">
          <p id="question-text"></p>
          <p id="question-prompt" class="prompt">
            <img id="prompt-flag" class="prompt-flag hidden" alt="">
            <span id="prompt-text"></span>
          </p>
        </div>

        <div id="quiz-stage" class="quiz-stage">
          <div id="flag-stage" class="flag-stage hidden">
            <img id="question-flag" class="flag" alt="Flag to identify">
          </div>
          <div id="map-panel" class="map-panel hidden">
            <div id="map" class="map"></div>
            <div class="map-controls">
              <button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
              <button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
              <button id="zoom-reset" aria-label="Reset view" title="Reset view">⟲</button>
            </div>
            <p id="map-hint" class="map-hint">
              <span class="touch-only">Pinch to zoom · drag to move · tap a country</span>
              <span class="mouse-only">Scroll to zoom · drag to move · click a country</span>
            </p>
            <p id="feedback" class="feedback hidden" role="status"></p>
          </div>
        </div>

        <div class="quiz-answer">
          <div id="options" class="options"></div>
          <button id="confirm-btn" class="primary hidden" disabled>Tap a country on the map</button>
          <button id="next-btn" class="primary hidden">Next →</button>
        </div>
      </div>
    </section>

    <!-- Results screen -->
    <section id="results-screen" class="screen hidden">
      <h2>Results</h2>
      <p id="result-summary" class="big"></p>
      <p id="result-detail" class="muted"></p>
      <div class="row">
        <button id="retry-mistakes-btn" class="secondary">Practise mistakes</button>
        <button id="again-btn" class="primary">Play again</button>
      </div>
      <div id="mistakes"></div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
